<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Biosensor · OpenDART Financial Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px 24px 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}h1{font-size:32px;letter-spacing:-.04em;margin:5px 0}.sub,.small{color:var(--muted);font-size:13px}.toplinks a{color:var(--accent);text-decoration:none;font-weight:700;margin-left:10px}.notice,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px rgba(15,23,42,.04)}.notice{padding:13px 16px;margin-bottom:16px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.card{padding:15px}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:23px;font-weight:800;margin-top:8px;letter-spacing:-.03em}.unit{font-size:11px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.panel{padding:16px}.panel h2{font-size:18px;margin:0 0 10px}.chartbox{height:330px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.data-table{border-collapse:collapse;width:100%;min-width:1500px;font-size:12px}.data-table th,.data-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.data-table th{background:#f8fafc;font-weight:800}.data-table th:first-child,.data-table td:first-child{text-align:left;position:sticky;left:0;background:inherit}.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}footer{margin-top:24px;color:var(--muted);font-size:11px;line-height:1.7}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:18px 12px 50px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}header{display:block}.toplinks{margin-top:10px}.toplinks a{margin:0 8px 0 0}}</style></head><body><div class="wrap"><header><div><span class="badge">OpenDART · 137310</span><h1>에스디바이오센서 재무 Dashboard</h1><div class="sub">사업보고서 · 반기보고서 · 분기보고서 기반의 자동 재무분석</div></div><div class="toplinks"><a href="https://github.com/HSC-Class02/HN_SD.BIO" target="_blank">GitHub Repo ↗</a><a href="https://dart.fss.or.kr/" target="_blank">DART ↗</a></div></header><div class="notice" id="notice">데이터를 불러오는 중입니다…</div><div class="cards" id="cards"></div><div class="grid"><section class="panel"><h2>매출 · 영업이익 · 순이익 추이</h2><div class="chartbox"><canvas id="profitChart"></canvas></div></section><section class="panel"><h2>이익률 추이</h2><div class="chartbox"><canvas id="marginChart"></canvas></div></section></div><div class="grid"><section class="panel"><h2>현금 · 차입금</h2><div class="chartbox"><canvas id="debtChart"></canvas></div></section><section class="panel"><h2>영업현금흐름 · FCF</h2><div class="chartbox"><canvas id="cashChart"></canvas></div></section></div><div id="tables"></div><section class="panel section"><div class="section-head"><h2>국내 Peer Firms</h2><span class="small">산업 참고군 · 우열/투자등급을 의미하지 않음</span></div><div class="table-wrap"><table class="data-table" style="min-width:760px"><thead><tr><th style="text-align:left">기업</th><th>종목코드</th><th>주요 영역</th><th>비고</th></tr></thead><tbody id="peers"></tbody></table></div></section><footer id="footer"></footer></div><script>
const fmt=(v,d=1)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d});const money=v=>{if(v==null||Number.isNaN(Number(v)))return'—';const n=Math.abs(Number(v));let s=n>=1e12?(n/1e12).toFixed(2)+'조':n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(0)+'만':n.toLocaleString('ko-KR');return Number(v)<0?'-'+s:s};const latest=a=>a&&a.length?a[a.length-1]:null;const labels=a=>a.map(r=>(r.period?r.year+' '+r.period:r.year));function chart(id,type,labs,dsets){new Chart(document.getElementById(id),{type:type,data:{labels:labs,datasets:dsets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{usePointStyle:true}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+money(c.raw)}}},scales:{y:{ticks:{callback:v=>money(v)}},x:{grid:{display:false}}}}})}
const columns=[['Period',r=>r.period||''],['Revenue',r=>money(r.revenue)],['Gross Profit',r=>money(r.gross_profit)],['Operating Income',r=>money(r.operating_income)],['Net Income',r=>money(r.net_income)],['EBITDA',r=>money(r.ebitda)],['CFO',r=>money(r.cfo)],['CAPEX',r=>money(r.capex)],['FCF',r=>money(r.fcf)],['Assets',r=>money(r.assets)],['Cash',r=>money(r.cash)],['Receivables',r=>money(r.receivables)],['Inventory',r=>money(r.inventory)],['Liabilities',r=>money(r.liabilities)],['Debt',r=>money(r.debt)],['Net Debt',r=>money(r.net_debt)],['Equity',r=>money(r.equity)],['Gross %',r=>fmt(r.gross_margin)+'%'],['Operating %',r=>fmt(r.operating_margin)+'%'],['Net %',r=>fmt(r.net_margin)+'%'],['ROA',r=>fmt(r.roa)+'%'],['ROE',r=>fmt(r.roe)+'%'],['ROIC',r=>fmt(r.roic)+'%'],['Current',r=>fmt(r.current_ratio,2)],['Quick',r=>fmt(r.quick_ratio,2)],['Debt %',r=>fmt(r.debt_ratio)+'%'],['Equity %',r=>fmt(r.equity_ratio)+'%'],['Interest Cov.',r=>fmt(r.interest_coverage,2)+'x'],['Net Debt/EBITDA',r=>fmt(r.net_debt_ebitda,2)+'x'],['Asset Turnover',r=>fmt(r.asset_turnover,2)+'x'],['DSO',r=>fmt(r.dso,1)],['DIO',r=>fmt(r.dio,1)],['DPO',r=>fmt(r.dpo,1)],['CCC',r=>fmt(r.ccc,1)],['Revenue Growth',r=>fmt(r.revenue_growth)+'%'],['CFO/NI',r=>fmt(r.cfo_to_net_income,2)+'x']];function table(title,rows){let h='<section class="panel section"><div class="section-head"><h2>'+title+'</h2><span class="small">'+rows.length+' observations</span></div><div class="table-wrap"><table class="data-table"><thead><tr>';columns.forEach(c=>h+='<th>'+c[0]+'</th>');h+='</tr></thead><tbody>';rows.slice().reverse().forEach(r=>{h+='<tr>';columns.forEach(c=>h+='<td>'+c[1](r)+'</td>');h+='</tr>'});return h+'</tbody></table></div></section>'}
(async()=>{const data=await(await fetch('data/financials.json',{cache:'no-store'})).json(),a=data.annual||[],h=data.half||[],q=data.quarterly||[],l=latest(a)||latest(h)||{};document.getElementById('notice').innerHTML='마지막 업데이트: <b>'+(data.updated_at_utc?new Date(data.updated_at_utc).toLocaleString('ko-KR'):'아직 실행 전')+'</b> · 표준 재무 API 범위: <b>2015년 이후</b> · 2010–2014는 레거시 파서 대상';const cards=[['매출',money(l.revenue)],['영업이익',money(l.operating_income)],['순이익',money(l.net_income)],['영업이익률',l.operating_margin==null?'—':fmt(l.operating_margin)+'%'],['ROE',l.roe==null?'—':fmt(l.roe)+'%'],['순차입금',money(l.net_debt)]];document.getElementById('cards').innerHTML=cards.map(c=>'<div class="card"><div class="label">'+c[0]+'</div><div class="value">'+c[1]+'</div><div class="unit">latest reported period</div></div>').join('');if(a.length){const labs=labels(a);chart('profitChart','bar',labs,[{label:'Revenue',data:a.map(r=>r.revenue),borderWidth:1},{label:'Operating Income',data:a.map(r=>r.operating_income),borderWidth:1},{label:'Net Income',data:a.map(r=>r.net_income),borderWidth:1}]);chart('marginChart','line',labs,[{label:'Gross Margin',data:a.map(r=>r.gross_margin),tension:.25},{label:'Operating Margin',data:a.map(r=>r.operating_margin),tension:.25},{label:'Net Margin',data:a.map(r=>r.net_margin),tension:.25}]);chart('debtChart','bar',labs,[{label:'Cash',data:a.map(r=>r.cash),borderWidth:1},{label:'Debt',data:a.map(r=>r.debt),borderWidth:1},{label:'Net Debt',data:a.map(r=>r.net_debt),borderWidth:1}]);chart('cashChart','line',labs,[{label:'CFO',data:a.map(r=>r.cfo),tension:.25},{label:'FCF',data:a.map(r=>r.fcf),tension:.25}])}document.getElementById('tables').innerHTML=table('Annual',a)+table('Half-year',h)+table('Quarterly',q);document.getElementById('peers').innerHTML=(data.peers||[]).map(p=>'<tr><td style="text-align:left">'+p.name+'</td><td>'+p.ticker+'</td><td>'+p.focus+'</td><td>'+p.note+'</td></tr>').join('');document.getElementById('footer').textContent='Source: OpenDART · corp_code '+data.corp_code+'. Amounts use the API reported KRW numeric scale; derived ratios should be cross-checked with the original filing.'})().catch(e=>document.getElementById('notice').textContent='Dashboard data load failed: '+e.message);
</script></body></html>
